name: Quarkus CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify Java version
        run: java --version

      - name: Build and test with coverage
        run: ./mvnw verify -Pcoverage

      - name: Inspect JaCoCo report
        run: |
          echo "=== Source files ==="
          find src -type f
          
          echo "=== JaCoCo reports ==="
          find target/site/jacoco -type f
          
          echo "=== JaCoCo source entries ==="
          grep -o '<source>[^<]*</source>' target/site/jacoco/jacoco.xml || true
          
          echo "=== JaCoCo package/class entries ==="
          grep -o '<package name="[^"]*"' target/site/jacoco/jacoco.xml || true

      - name: SonarQube analysis
        run: ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}